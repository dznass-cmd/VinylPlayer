[package]
name = "vinyl-player"
version = "0.1.0"
edition = "2021"
authors = ["Dzerivado <187990890+dznass-cmd@users.noreply.github.com>"]
description = "Player de música analógico, nativo, leve e integrado ao desktop Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/dznass-cmd/VinylPlayer"
readme = "README.md"
keywords = ["music-player", "gtk4", "libadwaita", "audio", "vinyl"]
categories = ["multimedia::audio"]
default-run = "vinylplayer"

[[bin]]
name = "vinylplayer"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gdk-pixbuf = "0.20"
anyhow = "1"
serde_json = "1"
gstreamer = "0.23"
gstreamer-audio = "0.23"
zbus = "4"
zvariant = "4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
