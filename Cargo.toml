[package]
name = "vinyl-player"
version = "0.4.1"
edition = "2021"
authors = ["Dzerivado <187990890+dznass-cmd@users.noreply.github.com>"]
description = "Analog-inspired, lightweight, and native music player for the Linux desktop"
license = "GPL-3.0-or-later"
repository = "https://github.com/dznass-cmd/VinylPlayer"
readme = "README.md"
keywords = ["music-player", "gtk4", "libadwaita", "audio", "vinyl"]
categories = ["multimedia::audio"]
default-run = "vinylplayer"

[[bin]]
name = "vinylplayer"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.22"
gdk-pixbuf = "0.22"
anyhow = "1"
serde_json = "1"
gstreamer = "0.25"
zbus = "6"
zvariant = "5"
md-5 = "0.11.0"
ureq = { version = "3.5.2", features = ["json"] }
hex = "0.4.3"
oo7 = "0.7.3"
tokio = { version = "1", features = ["rt", "net", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
